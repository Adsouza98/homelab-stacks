services:
    organizr:
        container_name: organizr
        hostname: organizr
        image: organizr/organizr:latest
        restart: unless-stopped
        environment:
            - PUID=568
            - PGID=568
            - TZ=America/New_York
        volumes:
            - /mnt/Starlink/Stacks/homelab-stacks/website/configs/organizr:/config
        ports:
            - 85:80
    ombi:
        container_name: ombi
        hostname: ombi
        image: lscr.io/linuxserver/ombi:latest
        restart: unless-stopped
        environment:
          - PUID=568
          - PGID=568
          - TZ=America/New_York
          #- BASE_URL=/ #optional
        volumes:
          - /mnt/Starlink/Stacks/homelab-stacks/website/configs/ombi:/config
        ports:
          - 3579:3579
        depends_on:
          db:
            condition: service_started
    nginx-proxy-manager:
      container_name: nginx-proxy-manager
      image: 'jc21/nginx-proxy-manager:latest'
      ports:
        - '80:80'
        - '82:81'
        - '443:443'
      environment:
        PUID: 0
        PGID: 0
        DB_MYSQL_HOST: "db"
        DB_MYSQL_PORT: 3306
        DB_MYSQL_USER: ${DB_USER}
        DB_MYSQL_PASSWORD: ${DB_PASSWORD}
        DB_MYSQL_NAME: ${DB_NAME}
      volumes:
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/nginx-proxy-manager/data:/data
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/nginx-proxy-manager/theme-park/98-themepark-npm/98-themepark:/etc/cont-init.d/99-themepark
    db:
      container_name: db
      image: 'jc21/mariadb-aria:latest'
      environment:
        PUID: 568
        PGID: 568
        MYSQL_DATABASE: ${DB_NAME}
        MYSQL_USER: ${DB_USER}
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      volumes:
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/mysql:/var/lib/mysql
    mariadb-client:
      image: mariadb:latest
      container_name: mariadb-client
      command: sleep infinity         # keeps it running so you can exec into it
      networks:
        - default
      restart: unless-stopped