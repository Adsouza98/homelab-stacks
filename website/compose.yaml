services:
    organizr:
        container_name: organizr
        hostname: organizr
        image: organizr/organizr:latest
        restart: unless-stopped
        environment:
            - PUID=568
            - PGID=568
            - TZ=America/New_York
        volumes:
            - /mnt/Starlink/Stacks/homelab-stacks/website/configs/organizr:/config
        ports:
            - 85:80
    ombi:
        container_name: ombi
        hostname: ombi
        image: lscr.io/linuxserver/ombi:v4.53.10-ls255
        restart: unless-stopped
        environment:
          - PUID=568
          - PGID=568
          - TZ=America/New_York
          #- BASE_URL=/ #optional
        volumes:
          - /mnt/Starlink/Stacks/homelab-stacks/website/configs/ombi:/config
        ports:
          - 3579:3579
        depends_on:
          mariadb:
            condition: service_healthy
    nginx-proxy-manager:
      container_name: nginx-proxy-manager
      image: 'jc21/nginx-proxy-manager:2.15.1'
      ports:
        - '80:80'
        - '82:81'
        - '443:443'
      environment:
        PUID: 0
        PGID: 0
        DB_MYSQL_HOST: "mariadb"
        DB_MYSQL_PORT: 3306
        DB_MYSQL_USER: ${DB_USER}
        DB_MYSQL_PASSWORD: ${DB_PASSWORD}
        DB_MYSQL_NAME: ${DB_NAME}
      volumes:
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/nginx-proxy-manager/data:/data
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/nginx-proxy-manager/theme-park/98-themepark-npm/98-themepark:/etc/cont-init.d/99-themepark
      depends_on:
        mariadb:
          condition: service_healthy
    mariadb:
      image: mariadb:12.2
      container_name: mariadb
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        # We will create the ombi database manually
      volumes:
        - /mnt/Starlink/Stacks/homelab-stacks/website/configs/mariadb:/var/lib/mysql
      command: >
        --character-set-server=utf8mb4
        --collation-server=utf8mb4_unicode_ci
        --innodb-default-row-format=DYNAMIC
        --max_allowed_packet=256M
        --innodb-buffer-pool-size=512M
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 40s
