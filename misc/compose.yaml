services:
  muse:
    container_name: muse
    image: ghcr.io/museofficial/muse:2.11.8
    restart: always
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/muse:/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}

  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:v0.9.5-omnibus
    cap_add:
      - SYS_RAWIO
    ports:
      - "9090:8085" # webapp
      - "8086:8086" # influxDB admin
    volumes:
      - /run/udev:/run/udev:ro
      - ./config:/opt/scrutiny/config
      - ./influxdb:/opt/scrutiny/influxdb
    devices:
      - "/dev/sda"
      - "/dev/sdb"
      - "/dev/sdc"
      - "/dev/sdd"
      - "/dev/sde"
      - "/dev/sdf"
      - "/dev/sdg"
      - "/dev/sdh"
      - "/dev/sdi"
      - "/dev/sdj"
      - "/dev/sdk"
      - "/dev/sdm"
  threadfin:
    container_name: threadfin
    image: fyb3roptik/threadfin:1.2.37
    ports:
      - 34400:34400
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/Toronto
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/threadfin/conf:/home/threadfin/conf
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/threadfin/temp:/tmp/threadfin:rw
    restart: unless-stopped

  # Vela — Tesla cabin player (YouTube + Plex). Not on the VPN.
  # Sign-in is inside Vela (two seats). Nginx Proxy Manager and Cloudflare
  # only proxy it. HTTPS is required for full quality: websockets on,
  # and `proxy_buffering off`.
  tesla-media-player:
    container_name: tesla-media-player
    image: ghcr.io/adsouza98/tesla-media-player:0.2.1
    restart: unless-stopped
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/Toronto
      - APP_PASSWORD=${VELA_PASSWORD}
      - OWNER_NAME=${VELA_OWNER_NAME:-JuniorChange}
      - OWNER_USERNAME=${VELA_OWNER_USERNAME:-juniorchange}
      - OWNER_EMAIL=${VELA_OWNER_EMAIL:-}
      - OWNER_PLEX_USERNAME=${VELA_OWNER_PLEX:-}
      - TEST_USERNAME=${VELA_TEST_USERNAME:-grok}
      - TEST_PASSWORD=${VELA_TEST_PASSWORD:-}
      - TEST_EMAIL=${VELA_TEST_EMAIL:-}
      - TEST_PLEX_USERNAME=${VELA_TEST_PLEX:-}
      - GOOGLE_CLIENT_ID=${VELA_GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${VELA_GOOGLE_CLIENT_SECRET:-}
      - PUBLIC_URL=${VELA_PUBLIC_URL:-}
      - PLEX_URL=${PLEX_URL:-http://192.168.1.42:32400}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - DEFAULT_QUALITY=${VELA_QUALITY:-1080}
      - YOUTUBE_COOKIES=/config/youtube-cookies.txt
      - CONFIG_DIR=/config
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/tesla-media-player:/config
    ports:
      - 8095:8095
