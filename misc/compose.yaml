services:
  muse:
    container_name: muse
    image: ghcr.io/museofficial/muse:2.11.8
    restart: always
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/muse:/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}

  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:v0.9.5-omnibus
    cap_add:
      - SYS_RAWIO
    ports:
      - "9090:8085" # webapp
      - "8086:8086" # influxDB admin
    volumes:
      - /run/udev:/run/udev:ro
      - ./config:/opt/scrutiny/config
      - ./influxdb:/opt/scrutiny/influxdb
    devices:
      - "/dev/sda"
      - "/dev/sdb"
      - "/dev/sdc"
      - "/dev/sdd"
      - "/dev/sde"
      - "/dev/sdf"
      - "/dev/sdg"
      - "/dev/sdh"
      - "/dev/sdi"
      - "/dev/sdj"
      - "/dev/sdk"
      - "/dev/sdm"
  threadfin:
    container_name: threadfin
    image: fyb3roptik/threadfin:1.2.37
    ports:
      - 34400:34400
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/Toronto
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/threadfin/conf:/home/threadfin/conf
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/threadfin/temp:/tmp/threadfin:rw
    restart: unless-stopped

  tesla-take-the-wheel:
    container_name: tesla-take-the-wheel
    # Published by Adsouza98/teslatakethewheel. Pin the version tag, not latest.
    image: ghcr.io/adsouza98/teslatakethewheel:1.3.2
    user: "568:568"
    restart: unless-stopped
    environment:
      - TZ=America/Toronto
      - PORT=8080
      - DATA_DIR=/app/data
      - LOG_LEVEL=${TTW_LOG_LEVEL:-info}
      - BIND=0.0.0.0
      - EXTRA_LISTENERS=0
      # Enable only when the published port is restricted to the reverse proxy.
      - BEHIND_PROXY=${TTW_BEHIND_PROXY:-0}
      - YOUTUBE_CLIENT_ID=${TTW_YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${TTW_YOUTUBE_CLIENT_SECRET:-}
      - OPENSUBTITLES_API_KEY=${TTW_OPENSUBTITLES_API_KEY:-}
      - OPENSUBTITLES_USERNAME=${TTW_OPENSUBTITLES_USERNAME:-}
      - OPENSUBTITLES_PASSWORD=${TTW_OPENSUBTITLES_PASSWORD:-}
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/misc/configs/tesla-take-the-wheel:/app/data
    ports:
      - "${TTW_BIND_IP:-0.0.0.0}:${TTW_PORT:-8096}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    # /api/state needs a session. This endpoint is open before the first account exists.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/auth/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
