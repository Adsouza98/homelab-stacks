  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0-ls377
    container_name: deluge
    network_mode: service:gluetun    # This uses ExpressVPN’s network stack - 8112:8112 | 6881:6881/udp | 6881:6881/tcp
