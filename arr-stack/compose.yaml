services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_CUSTOM_CONFIG=/gluetun/ovpn/Toronto.ovpn

      # Keep your TLS timeout (still useful)
      - OPENVPN_FLAGS=--tls-timeout 120

      # Optional but recommended for ExpressVPN
      # - OPENVPN_PROTOCOL=udp               # or tcp if you want to try TCP 443
    ports:
      - 9696:9696     # prowlarr
      - 7878:7878     # radarr
      - 8787:8787     # radarr-4k
      - 8989:8989     # sonarr
      - 9898:9898     # sonarr-4k
      - 6767:6767     # bazarr
      - 8191:8191     # flaresolverr
      - 8080:8080     # sabnzbd
      - 8112:8112     # deluge
      - 6881:6881/udp # deluge - Torrenting
      - 6881:6881/tcp # deluge - Torrenting
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/arr-stack/configs/gluetun/:/gluetun
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5.5327-ls147
    container_name: prowlarr
    network_mode: service:gluetun  # This uses ExpressVPN’s network stack - 9696:9696
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/New_York
      # Theme-park
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:prowlarr
      - TP_THEME=organizr
      - TP_ADDON=prowlarr-text-logo
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/arr-stack/configs/prowlarr/:/config          # Config
      - /mnt/Starlink/Movies/:/mnt/Starlink/Movies                                       # Movies
      - /mnt/Starlink/Movies-4K/:/mnt/Starlink/Movies-4K                                 # Movies-4k
      - /mnt/Starlink/TvShows/:/mnt/Starlink/TvShows                                     # TvShows
      - /mnt/Starlink/TvShows-4K/:/mnt/Starlink/TvShows-4K                               # TvShows-4k
      - /mnt/Starlink/Downloads/:/Downloads                                              # Downloads
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1.10360-ls303
    container_name: radarr
    network_mode: service:gluetun    # This uses ExpressVPN’s network stack - 7878:7878
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/New_York
      # Theme-park
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:radarr
      - TP_THEME=organizr
    volumes:
      - /mnt/Starlink/Stacks/homelab-stacks/arr-stack/configs/radarr/:/config            # Config
      - /mnt/Starlink/Movies/:/mnt/Starlink/Movies                                       # Movies
      - /mnt/Starlink/Downloads/:/Downloads                                              # Downloads
    restart: unless-stopped
  radarr-4k:
    image: lscr.io/linuxserver/radarr:6.1.1.10360-ls303
    container_name: radarr-4k
    network_mode: service:gluetun    # This uses ExpressVPN’s network stack - 8787:8787
    depends_on:
