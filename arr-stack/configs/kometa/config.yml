libraries: # This is called out once within the config.yml file
  Movies: # These are names of libraries in your Plex
    collection_files:
    - default: basic   # 1 - Newly Released
      filters:
        original_language: en
      template_variables:
        collection_section: 1
    - default: imdb   # 2 - IMDb Popular, IMDb Top 250
      filters:
        original_language: en
      template_variables:
        use_lowest: false
        collection_section: 2
    - default: bafta   # 3 - BAFTA Best Films
      template_variables:
        use_year_collections: false
        radarr_add_missing: true
        collection_order: release.desc
        collection_section: 3
    - default: oscars   # 4 - Oscars Best Picture Winners, Oscars Best Director Winners
      template_variables:
        use_year_collections: false
        radarr_add_missing: true
        collection_order: release.desc
        order_best_picture: 1
        order_best_director: 2
        collection_section: 4
    - default: director   # 5 - Collection of Movies by Director
      template_variables:
        use_separator: false
        collection_section: 5
        name_format: <<key_name>> Collection
        include:
        - Christopher Nolan
        - David Fincher
        - James Cameron
        - Martin Scorsese
        - Quentin Tarantino
        - Ridley Scott
        - Steven Spielberg
    - default: seasonal   # 6 - Collection of Movies for Seasonal Events
      filters:
        original_language: en
      template_variables:
        use_separator: false
        emoji: ''
        radarr_add_missing: false
        collection_section: 6
        exclude:
        - lgbtq     # LGBTQ+ Pride Month
        - black_history     # Black History Month
        - latinx     # Latinx Heritage Month
        - women     # Women's History Month
        - aapi     # AAPI Heritage Month
        - disabilities     # Disabilities Awareness Month
    - default: genre   # 7 - Collection of Movies by Genre
      filters:
        original_language: en
      template_variables:
        use_separator: false
        collection_section: 7
        exclude:
        - Children
        - Family
        - Fantasy
        - Film Noir
        - Food
        - Game
        - Indie
        - Martial Arts
        - Music
        - Musical
        - News
        - Reality
        - Romance
        - Short
        - Sport
        - Talk Show
        - Travel
        - TV Movie
        append_addons:
          Horror:
          - Thriller
          - Suspense
    - default: universe   # 8 - Collection of Moivie Universes
      template_variables:
        use_separator: false
        collection_order: release
        collection_section: 8
        radarr_add_missing: false
        radarr_ignore_cache: true
        exclude:
        - middle
        - mummy
        - askew
        - trek
        - dca
        - dcu
        append_data:
          monster: MonsterVerse
          bond: 007 - James Bond
          dcau: DC Animated Movie Universe
          dcao: DC Animated Originals
          dcuo: DC Original Films
          dceu: DC Extended Universe
          dcstudios: DC Universe Studios
          spidey: Spider-Man Universe
          mcu1: MCU - Phase 1
          mcu2: MCU - Phase 2
          mcu3: MCU - Phase 3
          mcu4: MCU - Phase 4
          mcu5: MCU - Phase 5
          pixar: Pixar Collection
          disney: Disney Live-Action Collection
          disa: Disney Animation Collection
          dream: Dreamworks Animation Collection
          scooby: Scooby-Doo Collection
          poki: Pokémon Collection
          george: George Collection
          jrchange: JuniorChange Collection
            # MonsterVerse
        trakt_list_monster: https://trakt.tv/users/juniorchange/lists/monsterverse
        url_poster_monster: https://theposterdb.com/api/assets/138821
            # 007 - James Bond
