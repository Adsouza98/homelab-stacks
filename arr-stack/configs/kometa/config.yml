settings:
  cache: true # Used to control PMM's cache database.
  cache_expiration: 60 # Used to control how long data is cached for.
  asset_directory: /config/assets # Used to define where local assets are located.
  asset_folders: true # Used to control the asset directory folder structure.
  asset_depth: 0 # Used to control the depth of search in the asset directory.
  create_asset_folders: false # Used to automatically create asset folders when none exist.
  prioritize_assets: false # Used to prioritize asset_directory images over all other images types.
  dimensional_asset_rename: false # Used to automatically rename asset files based on their dimensions.
  download_url_assets: false # Used to download url images into the asset directory.
  show_missing_season_assets: false # Used to show any missing season assets.
  show_missing_episode_assets: false # Used to show any missing episode assets.
  show_asset_not_needed: true # Used to show/hide the update not needed messages.
  sync_mode: append # Used to set the sync_mode for collections and playlists.
  minimum_items: 1 # Used to control minimum items requires to build a collection/playlist.
  default_collection_order: # Used to set the collection_order for every collection run.
  delete_below_minimum: true # Used to delete collections below minimum_items.
  delete_not_scheduled: false # Used to delete collections not scheduled.
  run_again_delay: 2 # Used to control the number of minutes to delay running run_again collections.
  missing_only_released: false # Used to filter unreleased items from missing lists.
  only_filter_missing: false # Used to have the filter only apply to missing items.
  show_unmanaged: true # Used to show collections not managed by PMM.
  show_filtered: false # Used to show filtered items.
  show_options: false # Used to show attribute options from plex.
  show_missing: true # Used to show missing items from collections or playlists.
  show_missing_assets: true # Used to print a message when assets are missing.
  save_report: false # Used to save a report YAML file.
  tvdb_language: eng # Specify the language to query TVDb in.
  ignore_ids: # List of TMDb/TVDb IDs to ignore.
  ignore_imdb_ids: # List of IMDb IDs to ignore.
  item_refresh_delay: 0 # Time to wait between each item_refresh.
  playlist_sync_to_user: all # Set the default playlist sync_to_users.
  playlist_exclude_user: # Set the default playlist exclude_users.
  playlist_report: false # Used to print out a playlist report.
  verify_ssl: true # Turn SSL Verification on or off.
  custom_repo: # Used to set up the custom repo file block type.
  check_nightly: false # Will check nightly for updates instead of develop.
  show_unconfigured: true # Used to show collections not in the current run.
  playlist_exclude_users: # Set the default playlist exclude_users.
  run_order: # Used to specify the run order of the library components.
  - operations
  - metadata
  - collections
  - overlays
  overlay_artwork_filetype: jpg
  overlay_artwork_quality:
  show_unfiltered: false
  auto_sort_hubs:
